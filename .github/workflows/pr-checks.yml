name: PR

# No path filters here: every PR must report the same final required check.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.classify.outputs.android }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select checks for the exact PR diff
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/ci/pr_checks.py classify "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  docs:
    name: Documentation and CI policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test routing and documentation checks
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py'
      - name: Check changed documentation links and images
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/ci/pr_checks.py docs "$BASE_SHA" "$HEAD_SHA"

  android:
    name: Android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    uses: ./.github/workflows/android-build.yml
    # No release environment or inherited signing secrets.

  result:
    name: PR checks
    if: always()
    needs: [changes, docs, android]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful checks, including Android when selected
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          ANDROID_NEEDED: ${{ needs.changes.outputs.android }}
          ANDROID_RESULT: ${{ needs.android.result }}
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = success
          test "$DOCS_RESULT" = success
          case "$ANDROID_NEEDED:$ANDROID_RESULT" in
            true:success) echo 'Documentation and Android checks passed.' ;;
            false:skipped) echo 'Documentation-only PR: Android build not needed.' ;;
            *) echo 'Required Android check failed, was cancelled or did not run.'; exit 1 ;;
          esac
